---
- name: Update apt cache and upgrade all system packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Remove packages no longer required
  ansible.builtin.apt:
    autoremove: true

- name: Clean up the local apt package cache
  ansible.builtin.apt:
    autoclean: true

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: elodin_reboot_required_file

# A pending reboot means the running kernel or libc is not the patched one,
# so finish the job here: maintenance already runs on a schedule chosen for
# the quiet hours, and the resolver is back within a minute.
- name: Reboot to finish applying updates
  ansible.builtin.reboot:
    msg: Rebooting to finish applying package updates
    reboot_timeout: 600
  when: elodin_reboot_required_file.stat.exists

- name: Wait for the DoT listener to answer again
  ansible.builtin.wait_for:
    port: 853
    timeout: 120
  when: elodin_reboot_required_file.stat.exists
