name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      elodin_version:
        description: "elodin package version to install (empty = latest)"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: mkdir -p ~/.ssh && printf "%s\n" "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - uses: jdx/mise-action@v2

      - env:
          ELODIN_VERSION: ${{ inputs.elodin_version }}
        run: |
          if [ -n "$ELODIN_VERSION" ]; then
            mise run deploy --extra-vars "elodin_version=$ELODIN_VERSION"
          else
            mise run deploy
          fi
