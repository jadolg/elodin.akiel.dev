[tools]
uv = "latest"
ansible = "latest"

[tasks.deploy]
description = "Run the Ansible playbook against elodin.akiel.dev"
run = "ansible-playbook playbook.yml"

[tasks.maintenance]
description = "System package upgrade + lego + elodin update"
run = "ansible-playbook playbook.yml --tags maintenance"

[tasks."renew-cert"]
description = "Force-renew the DoT certificate now, whether or not it's due"
run = "ssh root@elodin.akiel.dev 'systemctl start lego-force-renew.service; journalctl -u lego-force-renew.service -n 20 --no-pager'"

[tasks.restart]
description = "Restart the elodin service"
run = "ssh root@elodin.akiel.dev 'systemctl restart elodin.service && systemctl status elodin.service --no-pager -l'"

[tasks.check]
description = "Offline validation: inventory/vars parse, playbook and every role resolve"
run = [
  "ansible-inventory --list --output /dev/null",
  "ansible-playbook playbook.yml --syntax-check",
  "ansible-playbook playbook.yml --syntax-check --tags maintenance",
]
