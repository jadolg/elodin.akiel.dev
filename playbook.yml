---
- name: Deploy elodin as a public DoT resolver, certificates via Lego
  hosts: elodin.akiel.dev
  become: true
  # Order matters: the firewall must exist before anything opens :80 for a
  # moment, Lego must have issued a real certificate before elodin's DoT
  # listener can start against it, so elodin goes last.
  roles:
    - firewall
    - fail2ban
    - hardening
    # never-tagged: system package upgrades only run when explicitly
    # requested with --tags maintenance, never on a plain deploy.
    - role: maintenance
      tags: [maintenance, never]
    - role: lego
      tags: [maintenance]
    - role: elodin
      tags: [maintenance]
    - role: alloy
      tags: [maintenance]
      when: alloy_enabled
